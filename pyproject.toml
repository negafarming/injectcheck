[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "injectcheck"
version = "0.1.0"
description = "Regression tests for prompt injection and system prompt leakage in LLM applications."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Holo" }]
keywords = ["llm", "security", "prompt-injection", "red-team", "owasp", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
injectcheck = "injectcheck.cli:main"

[tool.setuptools.package-data]
injectcheck = ["suites/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src/injectcheck"]
